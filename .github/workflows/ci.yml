name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm docs:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gami_community_test
          POSTGRES_USER: gami
          POSTGRES_PASSWORD: gami_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gami -d gami_community_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://gami:gami_dev_password@localhost:5432/gami_community_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  smoke:
    name: Images work together
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.build.yml
      GAMI_VERSION: ci
    steps:
      - uses: actions/checkout@v4
      - name: Create test secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)"
            echo "PLATFORM_BOOTSTRAP_SECRET=$(openssl rand -hex 32)"
          } > .env
      - run: docker compose $COMPOSE_FILES build
      - run: docker compose $COMPOSE_FILES up -d --no-build --wait --wait-timeout 180
      - run: node scripts/smoke-test.mjs
      - name: Show logs on failure
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color --tail 100
