# Gami.Fied and the habit tracker together, in one command:
#   docker compose up -d
#
# On your machine, the dashboard is at http://localhost:3000 and the habit tracker at
# http://localhost:4000. For a public server, set the addresses below in .env (see the README's
# "Put it online" section).
#
# Secrets come from .env. Copy .env.example to .env and fill them in first.

name: gami-habit-tracker

x-gami-environment: &gami-environment
  DATABASE_URL: postgres://gami:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/gami
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  NODE_ENV: production
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in .env}
  # The dashboard's address. It also forwards /api and /v1 to the API, so it is the only
  # Gami.Fied address anyone needs.
  BETTER_AUTH_URL: ${DASHBOARD_URL:-http://localhost:3000}
  NEXT_PUBLIC_APP_URL: ${DASHBOARD_URL:-http://localhost:3000}
  TRUST_PROXY: ${TRUST_PROXY:-false}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gami
      POSTGRES_USER: gami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gami -d gami']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    image: ghcr.io/gami-fied/gami-api:${GAMI_VERSION:-1.3.1}
    command: ['node', 'packages/database/dist/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://gami:${POSTGRES_PASSWORD}@postgres:5432/gami
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/gami-fied/gami-api:${GAMI_VERSION:-1.3.1}
    restart: unless-stopped
    environment:
      <<: *gami-environment
      PORT: 3001
      HOST: 0.0.0.0
      PLATFORM_BOOTSTRAP_SECRET: ${PLATFORM_BOOTSTRAP_SECRET:?Set PLATFORM_BOOTSTRAP_SECRET in .env}
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3001/ready\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    image: ghcr.io/gami-fied/gami-worker:${GAMI_VERSION:-1.3.1}
    restart: unless-stopped
    environment:
      <<: *gami-environment
      OUTBOX_POLL_INTERVAL_MS: 1000
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  dashboard:
    image: ghcr.io/gami-fied/gami-dashboard:${GAMI_VERSION:-1.3.1}
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:3000:3000'
    environment:
      PORT: 3000
      API_URL: http://api:3001
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy

  habits:
    build: .
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:4000:4000'
    environment:
      # This server talks to Gami.Fied inside Docker; the browser uses the public address.
      GAMI_URL: http://dashboard:3000
      PUBLIC_GAMI_URL: ${DASHBOARD_URL:-http://localhost:3000}
      # Empty until you make a key in the dashboard. Then run: docker compose up -d habits
      GAMI_API_KEY: ${GAMI_API_KEY:-}
      PORT: 4000
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      - dashboard

volumes:
  postgres_data:
  redis_data:
