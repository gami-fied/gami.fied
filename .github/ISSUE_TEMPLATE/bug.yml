name: Bug report
description: Something does not work as the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please search the [open issues](https://github.com/gami-fied/gami.fied/issues) first.
        For a security problem, do not use this form. See [SECURITY.md](https://github.com/gami-fied/gami.fied/blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a rule that ...
        2. Send the event ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` field when you open the API's address (for example http://localhost:3001/), or the image tag you run.
      placeholder: 1.3.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Docker images (docker-compose.yml)
        - From source (pnpm dev)
        - One-click template (Render or DigitalOcean)
        - The public demo
        - Other
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      multiple: true
      options:
        - API
        - Worker (rules, streaks, deliveries)
        - Dashboard
        - '@gami.fied/sdk'
        - '@gami.fied/react'
        - '@gami.fied/elements'
        - Website or docs
        - Install or upgrade
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: From `docker compose logs api worker`, or the browser console. Remove keys, tokens and personal data first.
      render: text
