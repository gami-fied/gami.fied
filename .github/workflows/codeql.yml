name: CodeQL

# Looks for security problems in the TypeScript and JavaScript, on every change and once a week
# for newly found kinds of problem. Findings appear under the repository's Security tab.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/__tests__'
              - apps/website/public
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
