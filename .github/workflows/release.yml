name: Release

# Pushing a tag such as v1.2.3 tests the code, publishes the images, and creates a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Fails when the tag, package.json, the npm packages and the docs do not all name the same
      # version, or CHANGELOG.md has no section for it. Nothing is published in that case.
      - run: node scripts/set-version.mjs --check "${{ github.ref_name }}"

  verify:
    name: Verify
    needs: version
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish ${{ matrix.app }}
    needs: verify
    runs-on: ubuntu-latest
    # A normal build takes about 15 minutes. A stuck one fails here instead of after six hours.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gami-${{ matrix.app }}
          # Pre-releases such as 1.2.3-rc.1 only get their exact tag, and never `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Gami.Fied ${{ matrix.app }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: GAMI_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  github-release:
    name: Create GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Pin the compose file to this release
        run: |
          version="${TAG#v}"
          sed -i "s/GAMI_VERSION:-latest/GAMI_VERSION:-${version}/g" docker-compose.yml
          sed -i "s#GAMI_REGISTRY:-ghcr.io/gami-fied#GAMI_REGISTRY:-ghcr.io/${GITHUB_REPOSITORY_OWNER}#g" docker-compose.yml
          cp .env.production.example env.example
          # The env file wins over the compose default, so it has to name this release too.
          sed -i "s/^GAMI_VERSION=.*/GAMI_VERSION=${version}/" env.example
      - name: Read this version's notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v heading="## [${version}]" 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > release-notes.md
      - name: Create or update the release
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          notes="--generate-notes"
          if [[ -s release-notes.md ]]; then notes="--notes-file release-notes.md"; fi
          # A tag that was moved and pushed again already has its release: bring it up to date.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" docker-compose.yml env.example --clobber
            if [[ -s release-notes.md ]]; then gh release edit "$TAG" --title "Gami.Fied $TAG" --notes-file release-notes.md; fi
          else
            gh release create "$TAG" docker-compose.yml env.example \
              --title "Gami.Fied $TAG" \
              $notes \
              --verify-tag \
              $prerelease
          fi

  npm:
    name: Publish npm packages
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm accepts a publish only with GitHub's proof that it comes from this
      # workflow in this repository, so no npm token is stored anywhere. It also adds provenance.
      # Each package names this repository and `release.yml` under its trusted publishers on npm.
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. Node 22 comes with npm 10.
      - run: npm install --global npm@11.21.1
      - run: pnpm install --frozen-lockfile --filter "@gami.fied/elements..."
      - run: pnpm --filter "@gami.fied/elements..." build
      # In order, because each depends on the one before. `pnpm pack` turns `workspace:*` into the
      # real version, and `npm publish` does the trusted publishing, which pnpm cannot. A version
      # that is already on npm is skipped, so moving a tag and pushing it again is safe.
      - name: Publish
        run: |
          version="${TAG#v}"
          dist_tag="latest"
          if [[ "$version" == *-* ]]; then dist_tag="next"; fi
          mkdir -p packs
          for dir in sdk react elements; do
            name="$(node -p "require('./packages/${dir}/package.json').name")"
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${name}@${version} is already published."
              continue
            fi
            (cd "packages/${dir}" && pnpm pack --pack-destination ../../packs)
            npm publish "packs/$(echo "${name}" | sed 's#^@##; s#/#-#')-${version}.tgz" --access public --tag "$dist_tag"
          done

  docker-hub:
    name: Copy images to Docker Hub
    needs: images
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Skip when Docker Hub is not set up
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: echo "::notice::DOCKERHUB_USERNAME (a variable or a secret) or DOCKERHUB_TOKEN (a secret) is not set, so the images were not copied to Docker Hub."
      - if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Copies the multi-platform images as they are, with no rebuild, under the same tags as GHCR.
      - name: Copy
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          version="${TAG#v}"
          for app in api worker dashboard; do
            target="docker.io/${DOCKERHUB_USERNAME}/gami-${app}"
            tags=(-t "${target}:${version}")
            if [[ "$version" != *-* ]]; then
              minor="${version%.*}"
              tags+=(-t "${target}:${minor}" -t "${target}:${minor%.*}" -t "${target}:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "ghcr.io/${GITHUB_REPOSITORY_OWNER}/gami-${app}:${version}"
          done
