packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  source-map-js: ^1.2.2
  vite: ^8.2.4
  minimatch@10: ^11.0.1
  eslint-plugin-react-hooks>zod: ^4.6.6
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  '@esbuild-kit/esm-loader>esbuild': ^0.25.0
  httpsnippet>form-data: ^4.0.6
  '@tailwindcss/typography>postcss-selector-parser': ^6.1.5
allowBuilds:
