  - '@better-auth/drizzle-adapter@1.7.18'
  - '@better-auth/kysely-adapter@1.7.18'
  - '@better-auth/memory-adapter@1.7.18'
  - '@better-auth/mongo-adapter@1.7.18'
  - '@better-auth/prisma-adapter@1.7.18'
  - '@better-auth/telemetry@1.7.18'
  - better-auth@1.7.18
  - '@fastify/cors@11.4.1'
  - '@astrojs/internal-helpers@0.13.2'
  - '@astrojs/markdown-satteri@0.4.8 || 0.4.9'
  - '@astrojs/runtime@0.1.0'
  - '@astrojs/vite-plugin-astro@0.1.1'
  - astro@7.4.10
  - '@astrojs/react-renderer@0.1.1'
  - '@astrojs/react@7.1.7'
  - '@astrojs/mdx@8.1.5'
