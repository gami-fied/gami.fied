name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/check-bundle.mjs
      - run: pnpm docs:check
      - run: node scripts/set-version.mjs --check
      # Known vulnerabilities in what the images ship. Dev tools are left out.
      - run: pnpm audit --prod --audit-level high

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gami_community_test
          POSTGRES_USER: gami
          POSTGRES_PASSWORD: gami_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gami -d gami_community_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://gami:gami_dev_password@localhost:5432/gami_community_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  smoke:
    name: Images work together
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.build.yml
      GAMI_VERSION: ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Create test secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)"
            echo "PLATFORM_BOOTSTRAP_SECRET=$(openssl rand -hex 32)"
            # The page walk opens 150 pages from one address in a few minutes, far more than a person would.
            echo "RATE_LIMIT_IP_MAX=100000"
          } > .env
      - run: docker compose $COMPOSE_FILES build
      # A critical vulnerability that already has a fix fails the build, so it never reaches a release.
      - name: Scan the api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/gami-fied/gami-api:ci
          # Vulnerabilities only. The secret scanner flags example values in the built pages, and
          # secrets in the repository are caught by GitHub's secret scanning instead.
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/gami-fied/gami-worker:ci
          # Vulnerabilities only. The secret scanner flags example values in the built pages, and
          # secrets in the repository are caught by GitHub's secret scanning instead.
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the dashboard image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/gami-fied/gami-dashboard:ci
          # Vulnerabilities only. The secret scanner flags example values in the built pages, and
          # secrets in the repository are caught by GitHub's secret scanning instead.
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - run: docker compose $COMPOSE_FILES up -d --no-build --wait --wait-timeout 180
      - run: node scripts/smoke-test.mjs
      # Opens every dashboard page in a browser, in both themes and at phone width, and the admin
      # area, and fails on a broken page or a critical accessibility problem.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @gami/dashboard
      - name: Walk through the dashboard
        run: |
          export PLATFORM_BOOTSTRAP_SECRET="$(grep '^PLATFORM_BOOTSTRAP_SECRET=' .env | cut -d= -f2)"
          DASHBOARD_URL=http://localhost:3000 pnpm --filter @gami/dashboard walk
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-walk
          path: apps/dashboard/walk-output
          if-no-files-found: ignore
          retention-days: 14
      - name: Show logs on failure
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color --tail 100
