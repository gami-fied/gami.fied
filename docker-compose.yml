name: gami-community

services:
  postgres:
    image: postgres:17-alpine
    container_name: gami-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gami_community}
      POSTGRES_USER: ${POSTGRES_USER:-gami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gami_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-gami} -d $${POSTGRES_DB:-gami_community}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gami-network

  redis:
    image: redis:7-alpine
    container_name: gami-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gami-network

  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gami-migration
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gami}:${POSTGRES_PASSWORD:-gami_dev_password}@postgres:5432/${POSTGRES_DB:-gami_community}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gami-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gami-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gami}:${POSTGRES_PASSWORD:-gami_dev_password}@postgres:5432/${POSTGRES_DB:-gami_community}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-super-secret-auth-key-123456789}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - gami-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: gami-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gami}:${POSTGRES_PASSWORD:-gami_dev_password}@postgres:5432/${POSTGRES_DB:-gami_community}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-super-secret-auth-key-123456789}
      OUTBOX_POLL_INTERVAL_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - gami-network

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # Passed at build time so next.config.mjs rewrites bake in the correct internal hostname
        API_URL: http://api:3001
    container_name: gami-dashboard
    restart: unless-stopped
    ports:
      - '${DASHBOARD_PORT:-3000}:3000'
    environment:
      PORT: 3000
      # Browser-side: must point to the host-mapped port (localhost), NOT the internal Docker hostname
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
    networks:
      - gami-network

volumes:
  postgres_data:
    name: gami_postgres_data
  redis_data:
    name: gami_redis_data

networks:
  gami-network:
    name: gami_network
    driver: bridge
